<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Set data-theme to the stored choice before first paint, matching what triage.theme writes later.
      // Anything unreadable falls back to "system", which app.css resolves through prefers-color-scheme.
      try {
        var theme = JSON.parse(localStorage.getItem('rr:prefs') || '{}').theme
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme : 'system'
      } catch (e) {
        document.documentElement.dataset.theme = 'system'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
    <title>RepoRadar</title>
    <meta name="description" content="Discover trending open-source repositories by timeframe, triage them once, and keep only what matters. Data from the Trendshift static API." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
